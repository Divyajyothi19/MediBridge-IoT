; OPTIONAL — only for building locally (VS Code / Antigravity + PlatformIO).
; Not needed for wokwi.com in the browser. Not tested by the author.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    blynkkk/Blynk @ ^1.3.2
